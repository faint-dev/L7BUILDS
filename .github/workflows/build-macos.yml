name: Build macOS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref in lawrence-millard/l7code (branch, tag, or commit)
        required: true
        default: main
      force:
        description: Build even if this commit is already published
        type: boolean
        default: false
  push:
    branches: [main]
  schedule:
    # The private source repo cannot start workflows here, so poll its HEAD.
    # GitHub drops most cron ticks; treat this as a slow fallback, not a timer.
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: build-macos
  cancel-in-progress: false

jobs:
  check:
    name: Check source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.compare.outputs.build }}
    steps:
      - name: Compare source HEAD with published builds
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          REF: ${{ inputs.ref || 'main' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$FORCE" == "true" ]]; then
            echo "Forced." >&2
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          key="$RUNNER_TEMP/source_deploy_key"
          printf '%s\n' "$SOURCE_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          sha=$(git ls-remote "git@github.com:lawrence-millard/l7code.git" "$REF" | cut -f1)
          rm -f "$key"
          # A bare commit id resolves to nothing; treat the input as the commit.
          sha="${sha:-$REF}"
          short="${sha:0:7}"

          # Release notes name the built commit, so they double as the build marker.
          built=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].body')
          if grep -qF "@$short" <<< "$built"; then
            echo "$REF@$short is already published; skipping." >&2
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "$REF@$short has no build yet." >&2
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build arm64
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-14
    timeout-minutes: 45
    env:
      SOURCE_REPOSITORY: lawrence-millard/l7code
      SOURCE_REF: ${{ inputs.ref || 'main' }}
    steps:
      # Not actions/checkout: its submodule cleanup walks the orphaned gitlinks in
      # the vendored .repos tree, which a sparse checkout leaves unpopulated.
      - name: Checkout source
        id: source
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/source_deploy_key"
          printf '%s\n' "$SOURCE_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git init -q .
          git remote add origin "git@github.com:${SOURCE_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$SOURCE_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD
          rm -f "$key"
          echo "sha=$(git rev-parse --short FETCH_HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Build DMG and ZIP
        run: vp run dist:desktop:artifact --platform mac --target dmg --arch arm64

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/package.json').version")
          tag="v$version"
          notes=$(printf '%s\n\n%s\n' \
            "macOS arm64 build of L7CODE $version, from ${SOURCE_REPOSITORY}@${{ steps.source.outputs.sha }}." \
            "Ad-hoc signed, not notarized. On first launch use System Settings → Privacy & Security → Open Anyway if macOS blocks it.")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/*.dmg release/*.zip --clobber --repo "$GITHUB_REPOSITORY"
            # The check job reads the built commit from these notes, so they must
            # be rewritten when an existing version is rebuilt from a newer commit.
            gh release edit "$tag" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release/*.dmg release/*.zip --repo "$GITHUB_REPOSITORY" --title "L7CODE $version" --notes "$notes"
          fi
          shasum -a 256 release/*.dmg release/*.zip
